[project]
name = "news-suggestor"
version = "0.1.0"
description = "News aggregation suggestor for an Indian publication"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.20",
    "itsdangerous>=2.2",
    "apscheduler>=3.10",
    "feedparser>=6.0",
    "httpx>=0.28",
    "selectolax>=0.3",
    "sentence-transformers>=3.3",
    "numpy>=2.0",
    "anthropic>=0.40",
    "pyyaml>=6.0",
    "python-dateutil>=2.9",
    "rapidfuzz>=3.10",
    "playwright>=1.45",
    "playwright-stealth>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["sources.yaml", "web/templates/**/*.html", "web/static/**/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
