# Source registry.
#
# Currently scoped to a single source (Hindu National) while we tune
# clustering + scoring + filters end-to-end. Other sources are kept below
# this block (commented out) for easy reactivation — uncomment the YAML
# entry and redeploy.

- id: hindu_national
  name: The Hindu National
  type: rss
  url: https://www.thehindu.com/news/national/feeder/default.rss
  beats: [national]
  tier: 2
  fetch_interval_min: 15
  exclude_title_patterns:
    # The Hindu's own events / promo
    - 'EducationPlus'
    - "The Hindu['’]s Huddle"
    - 'Career Counselling'
    # Recurring opinion / lifestyle column tags
    - '^Mythos \|'
    - '^Beyond the textbook'
    - '^Puzzles?$'
    - '^Cartoonscape'
    # Local crime blotter
    - '^(Couple|Three (?:persons|men|women)|Two persons|Man|Woman) (?:arrested|detained|booked|held|killed|found dead)'
    - '(?:gutka|illicit liquor|illegal sale)'
    # Hyperlocal nature/wildlife filler
    - '(turtle hatchlings|Sahitya Academy|tiger reserve|neem trees|crude throughput|Kodava)'
  exclude_url_patterns:
    # State / city sub-paths under /news/national/ — these are local pages,
    # not national news. Keep top-level /news/national/ entries through.
    - 'thehindu\.com/news/cities/'
    - 'thehindu\.com/education/'
    - 'thehindu\.com/life-and-style/'
    - 'thehindu\.com/sci-tech/agriculture/'
    - 'thehindu\.com/society/'
    # Entertainment / sports / shorts — not editorial priority
    - 'thehindu\.com/entertainment/'
    - 'thehindu\.com/sport/'
    - 'thehindu\.com/shorts/'

- id: mint_news
  name: Mint News
  type: rss
  url: https://www.livemint.com/rss/news
  beats: [national]
  tier: 2
  fetch_interval_min: 15

- id: ie_national
  name: Indian Express India
  type: rss
  url: https://indianexpress.com/section/india/feed/
