- id: hindu_businessline
  name: The Hindu BusinessLine
  type: rss
  url: https://www.thehindubusinessline.com/feeder/default.rss
  beats: [economy]
  tier: 2
  fetch_interval_min: 15
  exclude_url_patterns:
    - 'thehindubusinessline\.com/portfolio/'
    - 'thehindubusinessline\.com/blink/'
    - 'thehindubusinessline\.com/specials/'

- id: moneycontrol_business
  name: MoneyControl Business
  type: rss
  url: https://www.moneycontrol.com/rss/business.xml
  beats: [economy]
  tier: 2
  fetch_interval_min: 15
  exclude_title_patterns:
    # Stock-pick / trading clickbait — not policy / macro news
    - '^(Top|Best|These|Why|Which) \d+ stock'
    - 'multibagger'
    - '^IPO subscribed'
    - '^Buy or sell'
    - 'target price'
    - '\bintraday\b'
    - '^F&O'
    - '^Stocks? to buy'
    - 'mutual fund.*(best|to buy|recommend)'
  exclude_url_patterns:
    - 'moneycontrol\.com/news/stocks-watch/'
    - 'moneycontrol\.com/news/buzzing-stocks/'
    - 'moneycontrol\.com/news/podcast/'
    - 'moneycontrol\.com/news/photos/'

