- id: bs_india
  name: Business Standard India
  type: rss
  url: https://www.business-standard.com/rss/india-news-216.rss
  beats: [national]
  tier: 2
  fetch_interval_min: 15

# Homepage hero-region fetchers. The top of each publication's homepage
# reflects newsroom judgment about the lead stories of the moment —
# regardless of which RSS section they're filed under. Each fetch
# screenshots the top crop_height pixels, extracts anchors, and sends
# both to Claude vision to pick out the actual lead headlines.
- id: hindu_homepage
  name: The Hindu (homepage hero)
  type: homepage
  url: https://www.thehindu.com/
  beats: [national]
  tier: 2
  fetch_interval_min: 30
  # Skip ad banner + masthead + nav (~270px), capture the full hero area below.
  crop_y_offset: 270
  crop_height: 1100

