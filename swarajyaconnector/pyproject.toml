[project]
name = "swarajya-mcp"
version = "0.1.0"
description = "MCP server for swarajyamag.com — search, fetch, and explore Swarajya articles via the Quintype public API."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Swarajya", email = "editor@swarajyamag.com" },
]
dependencies = [
    "mcp[cli]>=1.2.0",
    "httpx>=0.27",
    "pydantic>=2.6",
    "beautifulsoup4>=4.12",
    "markdownify>=0.11",
    "uvicorn>=0.30",
    "starlette>=0.37",
]

[project.scripts]
swarajya-mcp = "swarajya_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swarajya_mcp"]
